[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "https://www.christiansinseattle.org/*"
  to = "https://christiansinseattle.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://christiansinseattle.com/*"
  to = "https://christiansinseattle.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.christiansinseattle.com/*"
  to = "https://christiansinseattle.org/:splat"
  status = 301
  force = true
